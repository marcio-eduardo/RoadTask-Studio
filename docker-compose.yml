version: '3.8'

services:
  # Backend API em Python (FastAPI) com Supabase & Fallback Local
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: roadtask_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_KEY=${SUPABASE_KEY:-}
      - SUPABASE_TABLE=projects
    volumes:
      - ./backend/data:/app/data
